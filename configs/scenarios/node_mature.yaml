# Mature-deployment scenario (Phase 5 follow-up): the report's numbers assume 14 calibration days and 14 tuning days
# before testing, so demo recordings of 1–3 days show a young network (small calibration sets, h_default). This run
# simulates 31 days from day 0 — QCC calibrates, the node CUSUM and P1t tune h by replay — and records only days
# 29–31 (record.from_day). Scripted haze on day 30, scripted fire on day 31 at 13:00 beside the north-east footpath.
# Day 31 is set to a dry, busy day (the SPEC §11 storyboard's condition: two agreeing nodes suffice); the other days'
# types are drawn as usual (M33 legacy prior, P(dry) = 0.5).
scenario:
  name: node_mature
  description: "A mature network (calibrated and tuned over 28 days): haze on day 30, fire on day 31 — node evidence M24–M28"
run:
  seed: 11
  days: 31
record:
  every_k_ticks: 10
  from_day: 28
params:
  haze:
    scripted:
      - {t_min: 42360, duration_min: 480, amplitude: 1.6}  # day 30, 10:00–18:00 plus ramps
  srp:
    day_type_overrides:
      - {day: 31, type: dry_busy}
  ignition:
    scripted:
      - {t_min: 43980, x: 600, y: 445}                     # day 31, 13:00
