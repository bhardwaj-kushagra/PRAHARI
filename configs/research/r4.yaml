# Research protocol R4 (docs/research/protocol-r4.md): the price of haze at strict false-alarm budgets.
# Read by `python -m prahari.research r4-...`. The M20b haze and the grids are R2's (copied from configs/research/r2.yaml);
# only the episode rate changes between scenarios (params.haze.crop_burning_multiplier), and the node-target grid gains
# 0.03 and 0.05. Every scenario uses the same seed numbers, so comparisons between scenarios are paired by seed.
# DATA values come from results/research/real_thompson2026.json and real_sensorcommunity_stuttgart.json.
source: "TGT; docs/research/protocol-r4.md (R4, registered before any run)"
round: r4
base: configs/experiments/golden.yaml
m20b:                                    # R2 M20b haze defaults (protocol §2); each scenario overrides some of them
  form: m20b
  gain_sd: 0.3                           # DATA — N5 unattributed events, amplitude CV 0.25–0.34 (real_thompson2026.json)
  gain_corr_len_m: 200                   # ASM — correlation length of the node-gain field
  gain_corr_rho: 0.7                     # ASM — share of the gain spread that is spatially correlated
  gain_clip: [0.3, 2.0]                  # ASM
  uneven_s_range: [0.1, 0.6]             # DATA — per-episode spread s_e (CV ≈ 0.1–0.66; Stuttgart median 0.42)
  night_share: 0.7                       # DATA — 7 of 10 real unattributed events start 20:00–08:00
  night_window: [1200, 480]              # DER — 20:00–08:00 local (minute of day; run start 00:00)
  coverage_full_prob: 0.5                # DATA — N5 events involved 50–100% of stations
  coverage_partial_range: [0.3, 1.0]     # DATA
  swath_edge_m: 20                       # ASM
  outside_floor: 0.1                     # ASM
  network_width_m: 630                   # DER — 10 × 70 m grid, 9 spacings
  front_speed_ms: [1, 6]                 # DATA — N5 onset spreads 5–35 min over km-scale networks (ASM at 70 m)
  jitter_max_range_min: [0, 60]          # DATA — Stuttgart onsets spread 15–140 min (size at 70 m: ASM)
scenarios:
  H-none:
    role: primary contrast (no haze episodes)
    haze: {crop_burning_multiplier: 0.0}       # TGT — the counterfactual: M20b with no episodes
    seeds: {selection: {from: 5901, to: 5950}, test: {from: 6001, to: 6100}}
  H-mix:
    role: primary contrast (R2's H-mix)
    haze: {}                             # the m20b defaults
    seeds: {selection: {from: 5901, to: 5950}, test: {from: 6001, to: 6100}}
  H-mix-x0.3:
    role: dose-response (descriptive)
    haze: {crop_burning_multiplier: 0.3}       # ASM — dose point (the real NW-India rates are context, not its source)
    seeds: {test: {from: 6001, to: 6050}}
  H-mix-x3:
    role: dose-response (descriptive)
    haze: {crop_burning_multiplier: 3.0}       # ASM — dose point (R1's ×3 sweep value)
    seeds: {test: {from: 6001, to: 6050}}
grids:
  node: [0.03, 0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]   # M28 — target r (R1's grid plus 0.03, 0.05)
  v1t: [0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]           # AR (as R1)
  rho: [0, 1.5, 2, 3, 4, 6, 10]                                       # M31 — SCMR ratio threshold; 0 = off
  theta: [0.05, 0.1, 0.15, 0.2, 0.3, 0.5, null]                       # R10 — gate share; null = off
  gate_p: 0.01                                                        # R10
  gate_window_min: 30                                                 # R10
cap: {h_hi: 5000.0, bisect_iters: 22}    # M28 bisection bracket (as R1)
budgets: [0.3, 1, 3, 10]                 # operating points per scenario; family P at 1 a month
methods: [P2, P2-medSCMR, P2-gate]           # evaluated; family P covers all three
primary_budget: 1                              # family P (protocol §6)
useful_detection: 0.5                          # useful floor: lowest FA among cells with pooled detection >= 0.5
contrast: [H-none, H-mix]                      # family P: H-none minus H-mix, paired by seed
validity_incident_min: 1440                    # R2-D1, as R3
bootstrap: {seed: 20261007, resamples: 10000}
