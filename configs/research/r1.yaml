# Research protocol R1 (docs/research/protocol.md): pre-registered seeds, knob grids, budgets and sweeps.
# Read by `python -m prahari.research`; the simulation configuration itself is `base` (release 1.0, unchanged).
source: "TGT; docs/research/protocol.md (R1, pre-registered before any run)"
base: configs/experiments/golden.yaml
seeds:
  selection: {from: 901, to: 920}
  test: {from: 1001, to: 1100}
  sweep: {from: 1001, to: 1010}
grids:
  P0: [3, 3.5, 4, 4.5, 5, 6, 7, 8, 10, 12, 15, 20, 25, 30]          # M22 — k in μ + kσ
  P1: [8.8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 400, 600, 800]  # M23 — h
  v1t: [0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]          # M28 — target r (P1t, AR)
  node: [0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]         # M28 — target r (PRAHARI variants)
cap: {h_hi: 5000.0, bisect_iters: 22}   # M28 bisection bracket for the sweeps (protocol §3)
budgets: [1, 3, 10]                     # false incidents per month, 100-node network
primary_budget: 3
priors: [0.1, 0.2, 0.3]                 # wrong-prior sweep: srp day types flipped with probability q
bootstrap: {seed: 20260924, resamples: 10000}
pauc_range: [0.5, 10]                   # R8
sweep_pipelines: [P2, P2-SCMR, P2-Q2, P2-Q3, P2-med]   # PRAHARI variants in the sweeps (P0, P1, P1t, AR always run); P2-med added (R2-7)
sweeps:                                 # one change at a time from the golden configuration (protocol §5)
  ar_phi:      {key: params.sensor.ar_phi, values: [0.80, 0.90, 0.98]}
  sigma_e:     {key: params.sensor.sigma_e, values: [0.025, 0.10]}
  haze:        {key: params.haze.crop_burning_multiplier, values: [0, 3, 6]}
  gain_sd:     {key: params.haze.gain_sd, values: [0.1, 0.4]}
  nuisance:    {keys: [params.nuisance.rate_roadside_per_day, params.nuisance.rate_other_per_day], scale: [0.5, 2, 4]}
  drift:       {keys: [params.sensor.drift_step_sd, params.sensor.ageing_sd], scale: [2, 4]}
  plume:       {key: modules.plume, values: [real]}
  spacing:     {key: world.spacing_m, values: [50, 100, 150, 200]}
excluded_sweep_points:                  # points the simulated world cannot represent (reported, not analysed)
  spacing=200: "10 x 200 m exceeds the 1,400 m landscape: the layout check fails and siting degrades to its stub (a 70 m grid), so it is not a 200 m network (DECISIONS R2-9)"
