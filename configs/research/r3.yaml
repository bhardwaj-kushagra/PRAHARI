# Research protocol R3 (docs/research/protocol-r3.md): median + SCMR against the evidence gate, head to head.
# Read by `python -m prahari.research r3-...`. The M20b haze, scenarios and grids are R2's, unchanged (copied from
# configs/research/r2.yaml); only the seeds (fresh), the methods and the compared pair change.
# DATA values come from results/research/real_thompson2026.json and real_sensorcommunity_stuttgart.json.
source: "TGT; docs/research/protocol-r3.md (R3, registered before any run)"
round: r3
base: configs/experiments/golden.yaml
m20b:                                    # R2 M20b haze defaults (protocol §2); each scenario overrides some of them
  form: m20b
  gain_sd: 0.3                           # DATA — N5 unattributed events, amplitude CV 0.25–0.34 (real_thompson2026.json)
  gain_corr_len_m: 200                   # ASM — correlation length of the node-gain field
  gain_corr_rho: 0.7                     # ASM — share of the gain spread that is spatially correlated
  gain_clip: [0.3, 2.0]                  # ASM
  uneven_s_range: [0.1, 0.6]             # DATA — per-episode spread s_e (CV ≈ 0.1–0.66; Stuttgart median 0.42)
  night_share: 0.7                       # DATA — 7 of 10 real unattributed events start 20:00–08:00
  night_window: [1200, 480]              # DER — 20:00–08:00 local (minute of day; run start 00:00)
  coverage_full_prob: 0.5                # DATA — N5 events involved 50–100% of stations
  coverage_partial_range: [0.3, 1.0]     # DATA
  swath_edge_m: 20                       # ASM
  outside_floor: 0.1                     # ASM
  network_width_m: 630                   # DER — 10 × 70 m grid, 9 spacings
  front_speed_ms: [1, 6]                 # DATA — N5 onset spreads 5–35 min over km-scale networks (ASM at 70 m)
  jitter_max_range_min: [0, 60]          # DATA — Stuttgart onsets spread 15–140 min (size at 70 m: ASM)
scenarios:
  H-mix:
    role: primary (confirmatory)
    haze: {}                             # the m20b defaults
    seeds: {selection: {from: 3901, to: 3920}, test: {from: 4001, to: 4100}}
  H-sync:
    role: continuity with R1 (release-1.0 M20, unchanged)
    m20: true
    seeds: {test: {from: 4101, to: 4150}}
  H-gain:
    role: where median subtraction breaks
    haze: {gain_sd: 0.4}                 # the R1 sweep's stress value; above what the real events show
    seeds: {test: {from: 4151, to: 4200}}
  H-patch:
    role: where SCMR and medians break
    haze: {coverage_full_prob: 0.0, coverage_partial_range: [0.2, 0.5]}   # below the observed range (stress case)
    seeds: {test: {from: 4201, to: 4250}}
grids:
  node: [0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]          # M28 — target r (as R1)
  v1t: [0.1, 0.2, 0.3, 0.5, 0.75, 1, 1.5, 2, 3, 4.3, 6, 10]           # AR (as R1)
  rho: [0, 1.5, 2, 3, 4, 6, 10]                                       # M31 — SCMR ratio threshold; 0 = off
  theta: [0.05, 0.1, 0.15, 0.2, 0.3, 0.5, null]                       # R10 — gate share; null = off
  gate_p: 0.01                                                        # R10
  gate_window_min: 30                                                 # R10
cap: {h_hi: 5000.0, bisect_iters: 22}    # M28 bisection bracket (as R1)
budgets: [1, 3, 10, 30]                  # B*: the smallest every compared method reaches on the selection seeds
methods: [P2, P2-medSCMR, P2-gate]           # evaluated (P2 is the reference only)
compared: [P2-medSCMR, P2-gate]                # B* and the H1/H2 tests
reference: P2
validity_incident_min: 1440                    # R2-D1, registered from the start in R3
bootstrap: {seed: 20261003, resamples: 10000}
