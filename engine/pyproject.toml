[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "prahari"
version = "0.1.0"
description = "PRAHARI-SIM: simulator for the FIRENET-PRAHARI wildfire-detection system"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]

[project.scripts]
prahari = "prahari.cli:main"

[tool.setuptools.packages.find]
include = ["prahari*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
